<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمن حساباتك - مولد كلمات مرور .ne6b</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0a1d;
            --card-bg: rgba(20, 17, 39, 0.7);
            --border-color: rgba(139, 92, 246, 0.2);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .password-display {
            position: relative;
            background: rgba(10, 8, 22, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .password-display input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.2s;
            white-space: nowrap;
            margin-right: 10px;
        }

        .copy-btn:hover {
            background: var(--primary-hover);
        }

        .strength-meter {
            height: 6px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .length-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .length-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .length-header span:last-child {
            color: var(--primary);
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Custom Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .generate-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>أمن حساباتك</h1>
            <p>مولد كلمات مرور احترافي بواسطة .ne6b</p>
        </header>

        <div class="password-display">
            <input type="text" id="password" readonly placeholder="اضغط توليد...">
            <button class="copy-btn" id="copyBtn">نسخ</button>
        </div>

        <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"></div>
        </div>

        <div class="length-container">
            <div class="length-header">
                <span>طول كلمة المرور</span>
                <span id="lengthVal">16</span>
            </div>
            <input type="range" id="lengthRange" min="6" max="32" value="16">
        </div>

        <div class="settings">
            <div class="setting-item">
                <span>أحرف كبيرة (A-Z)</span>
                <label class="switch">
                    <input type="checkbox" id="uppercase" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>أحرف صغيرة (a-z)</span>
                <label class="switch">
                    <input type="checkbox" id="lowercase" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>أرقام (0-9)</span>
                <label class="switch">
                    <input type="checkbox" id="numbers" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>رموز خاصة (!@#$)</span>
                <label class="switch">
                    <input type="checkbox" id="symbols" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">توليد كلمة مرور جديدة</button>
    </div>

    <footer>
        تم التطوير بأمان وسرية داخل متصفحك. جميع الحقوق محفوظة .ne6b
    </footer>

    <script>
        const passwordEl = document.getElementById('password');
        const lengthRange = document.getElementById('lengthRange');
        const lengthVal = document.getElementById('lengthVal');
        const uppercaseEl = document.getElementById('uppercase');
        const lowercaseEl = document.getElementById('lowercase');
        const numbersEl = document.getElementById('numbers');
        const symbolsEl = document.getElementById('symbols');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const strengthBar = document.getElementById('strengthBar');

        const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
        const numberChars = '0123456789';
        const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        lengthRange.addEventListener('input', (e) => {
            lengthVal.textContent = e.target.value;
            generatePassword();
        });

        function generatePassword() {
            let chars = '';
            if (uppercaseEl.checked) chars += upperChars;
            if (lowercaseEl.checked) chars += lowerChars;
            if (numbersEl.checked) chars += numberChars;
            if (symbolsEl.checked) chars += symbolChars;

            if (chars === '') {
                passwordEl.value = 'اختر خياراً واحداً على الأقل!';
                strengthBar.style.width = '0%';
                return;
            }

            let password = '';
            const length = parseInt(lengthRange.value);
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }

            passwordEl.value = password;
            updateStrength(password);
        }

        function updateStrength(pass) {
            let score = 0;
            if (pass.length >= 10) score++;
            if (pass.length >= 16) score++;
            if (/[A-Z]/.test(pass) && /[a-z]/.test(pass)) score++;
            if (/[0-9]/.test(pass)) score++;
            if (/[^A-Za-z0-9]/.test(pass)) score++;

            if (score <= 2) {
                strengthBar.style.width = '33%';
                strengthBar.style.backgroundColor = '#ef4444';
            } else if (score <= 4) {
                strengthBar.style.width = '66%';
                strengthBar.style.backgroundColor = '#f59e0b';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.style.backgroundColor = '#10b981';
            }
        }

        copyBtn.addEventListener('click', () => {
            if (!passwordEl.value || passwordEl.value.includes('اختر')) return;
            navigator.clipboard.writeText(passwordEl.value);
            copyBtn.textContent = 'تم النسخ!';
            setTimeout(() => {
                copyBtn.textContent = 'نسخ';
            }, 1500);
        });

        generateBtn.addEventListener('click', generatePassword);
        window.addEventListener('load', generatePassword);
    </script>
</body>
      </html>
